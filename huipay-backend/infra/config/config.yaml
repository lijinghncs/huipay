# HuiPay 后端默认配置（local 环境）
http_port: 8080
gin_mode: release
log_level: debug
app_name: huipay-backend
app_env: local

# 日志文件输出（落盘 + 轮转）。enabled=false 时仅输出到标准输出。
log_file:
  enabled: true
  path: "logs/app.log"
  max_size_mb: 50
  max_age_day: 7

# 商户登录 token 签名密钥（HUIPAY_AUTH_SECRET 可覆盖；生产环境必须通过环境变量注入强密钥）
auth_secret: "dev-local-auth-secret-change-me"

# 管理后台登录账号（HUIPAY_ADMIN_USERNAME / HUIPAY_ADMIN_PASSWORD 可覆盖；生产必须通过环境变量注入）
admin_username: "admin"
admin_password: "admin123"

# 收银台 H5 地址前缀，付款码二维码 checkout_url 据此生成（生产应为 https://checkout.huipay.cn）
checkout_base_url: "http://localhost:5173"

# MySQL 主从 DSN（HUIPAY_MYSQL_MASTER / HUIPAY_MYSQL_SLAVE 可通过环境变量覆盖）
mysql_master: "root:lijing123!@#@tcp(127.0.0.1:3306)/huipay?charset=utf8mb4&parseTime=True&loc=Local"
mysql_slave: ""

# 微信支付 V3 配置。
# 密钥类字段（api_v3_key / merchant_private_key / platform_public_key）建议通过
# HUIPAY_WECHAT_* 环境变量注入，示例：
#   HUIPAY_WECHAT_ENABLED=true
#   HUIPAY_WECHAT_MCHID=1900000000
#   HUIPAY_WECHAT_APPID=wx8888888888888888
#   HUIPAY_WECHAT_API_V3_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   HUIPAY_WECHAT_MERCHANT_SERIAL_NO=xxxxxxxxxxxxxxxx
#   HUIPAY_WECHAT_MERCHANT_PRIVATE_KEY=$(cat apiclient_key.pem)
wechat:
  enabled: false
  mchid: ""
  appid: ""
  app_secret: ""
  api_v3_key: ""
  merchant_serial_no: ""
  merchant_private_key: ""
  platform_serial_no: ""
  platform_public_key: ""
  notify_base_url: "https://checkout.huipay.cn"
  base_url: "https://api.mch.weixin.qq.com"